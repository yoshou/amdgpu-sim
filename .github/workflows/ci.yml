name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  LLVM_VERSION: "22"
  LLVM_SYS_221_PREFIX: /usr/lib/llvm-22

jobs:
  test:
    name: cargo test --locked
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # llvm-sys resolves the library through llvm-config, and the crate builds
      # with `llvm-sys/prefer-dynamic`, so both llvm-config and libLLVM.so have
      # to come from the same LLVM 22 installation.
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/apt-llvm-org.gpg > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt-llvm-org.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libzstd-dev \
            llvm-${LLVM_VERSION} \
            llvm-${LLVM_VERSION}-dev \
            zlib1g-dev

      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version
          "${LLVM_SYS_221_PREFIX}/bin/llvm-config" --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked
        env:
          LD_LIBRARY_PATH: ${{ env.LLVM_SYS_221_PREFIX }}/lib
