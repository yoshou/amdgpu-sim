[package]
name = "amdgpu_sim"
version = "0.1.0"
authors = ["yoshou"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["dylib", "rlib"]

[dependencies]
num = "0.4.3"
indicatif = "0.15.0"
libm = "0.2.16"
num-traits = "0.2"
num-derive = "0.4"
llvm-sys = "221.0.1"
libc = "0.2"
aligned-vec = "0.6.4"
itertools = "0.14.0"
threadpool = "1.8.1"
half = "2.6.0"

[dev-dependencies]
rand = "0.10.2"
object = "0.7.0"
yaml-rust = "0.4"
serde = { version = "1.0.188", features = ["derive"] }
rmp-serde = "1.1.2"
png = "0.18.1"
getopts = "0.2"

[features]
default = ["llvm-sys/prefer-dynamic"]

[profile.release]
debug = "line-tables-only"
